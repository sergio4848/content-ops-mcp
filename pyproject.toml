[project]
name = "content-ops-mcp"
version = "0.1.0"
description = "MCP server that lets LLM clients manage a social media content calendar and send webhook notifications"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=2.2,<3", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
